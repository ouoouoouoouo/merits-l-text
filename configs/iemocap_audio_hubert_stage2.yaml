# Audio Stage II — Bi-GRU + self-attention on HuBERT Stage I features.
# Same architecture as vanilla WavLM Stage II (iemocap_audio_stage2.yaml).

run_name: iemocap_audio_hubert_stage2
seed: 42
output_dir: outputs/iemocap_audio_hubert_stage2

dataset:
  manifest_dir: data/manifests/iemocap
  # Produced by scripts/extract_audio_stage1_features.py
  # using outputs/iemocap_audio_hubert_stage1 best checkpoint
  features_path: data/cache/iemocap_audio_features_hubert_stage1.pt
  num_labels: 4
  label_names: [angry, happy, sad, neutral]

model:
  input_dim: 768
  gru_hidden: 384
  gru_layers: 2
  num_heads: 8
  dropout: 0.5
  num_labels: 4

train:
  epochs: 100
  batch_size: 8
  eval_batch_size: 16
  learning_rate: 5.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.06
  optimizer: adamw
  scheduler: linear
  grad_clip: 1.0
  fp16: false
  early_stopping_patience: 20
  save_best_metric: weighted_f1
  save_best_split: val
  num_workers: 2

logging:
  use_wandb: true
  wandb_project: merits-l-text
  log_every: 10
