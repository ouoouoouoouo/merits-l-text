# Audio Stage I — IEMOCAP, using features from OUR OWN trained CARE
# Replaces the WavLM-base substitute we used earlier.
# Paper target (Table I, audio Stage I): weighted F1 = 0.6693 (CARE)
#
# Prerequisite:
#   1. CARE trained: /home/ouo/care_training/ckpts/best.pth
#   2. Extract features: care-training/scripts/extract_iemocap_care_features.py
#      → data/cache/iemocap_care_features.pt   (shape per utt: (13, 1536))

run_name: iemocap_audio_care_stage1
seed: 42
output_dir: outputs/iemocap_audio_care_stage1

dataset:
  manifest_dir: data/manifests/iemocap
  features_path: data/cache/iemocap_care_features.pt   # CARE 13-layer per-utt
  num_labels: 4
  label_names: [angry, happy, sad, neutral]

model:
  input_dim: 768           # CARE `pooled_audio` utterance embedding
  hidden_dim: 768
  dropout: 0.3
  num_labels: 4
  # Note: MVP uses the model's own utterance-level pooling (`pooled_audio`).
  # For SUPERB 13-layer (paper Sec IV-B) uncomment and set num_layers: 13 +
  # re-extract features with the layer-hook version of the extractor.

train:
  epochs: 50
  batch_size: 32
  eval_batch_size: 64
  learning_rate: 1.0e-4
  weight_decay: 0.01
  warmup_ratio: 0.06
  optimizer: adamw
  scheduler: linear
  grad_clip: 1.0
  early_stopping_patience: 10
  save_best_metric: weighted_f1
  save_best_split: val
  num_workers: 2

logging:
  use_wandb: true
  wandb_project: merits-l-text
  log_every: 20
