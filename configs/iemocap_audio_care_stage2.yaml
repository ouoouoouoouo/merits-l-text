# Audio Stage II — IEMOCAP, using CARE-trained Stage I features
# Paper target: 0.7795 weighted F1 (Table I)
#
# Prerequisite:
#   1. Audio Stage I with CARE features done → outputs/iemocap_audio_care_stage1/best/audio_stage1.pt
#   2. Extract Stage I hidden features:
#      python -m scripts.extract_audio_stage1_features \
#          --stage1-ckpt outputs/iemocap_audio_care_stage1/best/audio_stage1.pt \
#          --raw-features data/cache/iemocap_care_features.pt \
#          --out-pt data/cache/iemocap_audio_care_stage1_features.pt

run_name: iemocap_audio_care_stage2
seed: 42
output_dir: outputs/iemocap_audio_care_stage2

dataset:
  manifest_dir: data/manifests/iemocap
  features_path: data/cache/iemocap_audio_care_stage1_features.pt
  num_labels: 4
  label_names: [angry, happy, sad, neutral]

model:
  input_dim: 1536          # audio Stage I hidden dim (matches Stage I hidden_dim=1536)
  gru_hidden: 512          # 2 * 512 = 1024
  gru_layers: 2
  num_heads: 8             # 1024 / 8 = 128
  dropout: 0.5
  num_labels: 4

train:
  epochs: 100
  batch_size: 8
  eval_batch_size: 16
  learning_rate: 5.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.06
  optimizer: adamw
  scheduler: linear
  grad_clip: 1.0
  fp16: false
  early_stopping_patience: 20
  save_best_metric: weighted_f1
  save_best_split: val
  num_workers: 2

logging:
  use_wandb: true
  wandb_project: merits-l-text
  log_every: 10
