# Stage III — Multimodal co-attention fusion, IEMOCAP (4-way)
# Paper target: weighted F1 = 0.8648 (Table I, MERITS-L text+audio fusion).
#
# Prerequisites:
#   1) Trained Text  Stage II  → run scripts/extract_stage2_utt_hidden.py
#      -> data/cache/iemocap_text_stage2_utt.pt   (per utt: (1024,))
#   2) Trained Audio Stage II  → run scripts/extract_stage2_utt_hidden.py
#      -> data/cache/iemocap_audio_stage2_utt.pt  (per utt: (256,))

run_name: iemocap_stage3
seed: 42
output_dir: outputs/iemocap_stage3

dataset:
  manifest_dir: data/manifests/iemocap
  # Text Stage II Bi-GRU output = 2 * gru_hidden_text = 2 * 512 = 1024
  text_features_path:  data/cache/iemocap_text_stage2_utt.pt
  # Audio Stage II Bi-GRU output = 2 * gru_hidden_audio = 2 * 128 = 256
  audio_features_path: data/cache/iemocap_audio_stage2_utt.pt
  num_labels: 4
  label_names: [angry, happy, sad, neutral]

model:
  text_dim: 1024           # matches text Stage II output (2 * gru_hidden=512)
  audio_dim: 256           # matches audio Stage II output (2 * gru_hidden=128)
  hidden_dim: 256          # common fusion dim
  num_heads: 8             # 256 / 8 = 32 per head
  dropout: 0.5
  num_labels: 4

train:
  epochs: 100
  batch_size: 8
  eval_batch_size: 16
  learning_rate: 5.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.06
  optimizer: adamw
  scheduler: linear
  grad_clip: 1.0
  fp16: false
  early_stopping_patience: 20
  save_best_metric: weighted_f1
  save_best_split: val
  num_workers: 2

logging:
  use_wandb: true
  wandb_project: merits-l-text
  log_every: 10
