# Stage III fusion — RoBERTa (baseline) text + Vanilla WavLM audio (no CARE).
#
# Ablation: strips CARE from baseline. Directly compares:
#   Baseline:  RoBERTa + CARE       = 0.8305 ± 0.0138 (best 0.8504)
#   This:      RoBERTa + WavLM      = ?
#
# Isolates CARE's specific contribution when paired with the paper's
# original text branch (RoBERTa-large + MSP-PODCAST pretrain).

run_name: iemocap_stage3_roberta_wavlm
seed: 42
output_dir: outputs/iemocap_stage3_roberta_wavlm

dataset:
  manifest_dir: data/manifests/iemocap
  # RoBERTa Stage II Bi-GRU output (2 * gru_hidden=512)
  text_features_path:  data/cache/iemocap_text_stage2_utt.pt
  # Vanilla WavLM Stage II Bi-GRU output (2 * gru_hidden=384)
  audio_features_path: data/cache/iemocap_audio_wavlm_stage2_utt.pt
  num_labels: 4
  label_names: [angry, happy, sad, neutral]

model:
  text_dim: 1024           # RoBERTa Stage II output
  audio_dim: 768           # Vanilla WavLM Stage II output
  hidden_dim: 256
  num_heads: 8
  dropout: 0.5
  num_labels: 4

train:
  epochs: 100
  batch_size: 8
  eval_batch_size: 16
  learning_rate: 5.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.06
  optimizer: adamw
  scheduler: linear
  grad_clip: 1.0
  fp16: false
  early_stopping_patience: 20
  save_best_metric: weighted_f1
  save_best_split: val
  num_workers: 2

logging:
  use_wandb: true
  wandb_project: merits-l-text
  log_every: 10
