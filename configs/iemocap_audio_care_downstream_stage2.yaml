# Audio Stage II — IEMOCAP, using CARE downstream Stage I 256-d hidden features
# Downstream = CARE paper's official EmotionClassifier head (SUPERB-13 + pooled_audio + 2-layer FC)
#
# Prerequisite:
#   Run scripts/train_care_downstream_iemocap.py with --save-hidden-pt
#   → data/cache/iemocap_care_downstream_stage1_hidden.pt

run_name: iemocap_audio_care_ds_stage2
seed: 42
output_dir: outputs/iemocap_audio_care_ds_stage2

dataset:
  manifest_dir: data/manifests/iemocap
  features_path: data/cache/iemocap_care_downstream_stage1_hidden.pt
  num_labels: 4
  label_names: [angry, happy, sad, neutral]

model:
  input_dim: 256           # CARE downstream Stage I hidden (fc_1 output)
  gru_hidden: 128          # 2 * 128 = 256
  gru_layers: 2
  num_heads: 8             # 256 / 8 = 32 per head
  dropout: 0.5
  num_labels: 4

train:
  epochs: 100
  batch_size: 8
  eval_batch_size: 16
  learning_rate: 5.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.06
  optimizer: adamw
  scheduler: linear
  grad_clip: 1.0
  fp16: false
  early_stopping_patience: 20
  save_best_metric: weighted_f1
  save_best_split: val
  num_workers: 2

logging:
  use_wandb: true
  wandb_project: merits-l-text
  log_every: 10
